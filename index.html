  <style>
    @layer base {

      html,
      body {
        margin: 0;
        padding: 0;
        scroll-behavior: smooth;
      }

      body {
        overscroll-behavior: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    }

    ::selection {
      background-color: rgba(18, 82, 36, 0.15);
      color: #125224;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f0f7f1;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #2e6b3a, #125224);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #125224;
    }

    /* Global link transition */
    * {
      box-sizing: border-box;
    }
  </style>
